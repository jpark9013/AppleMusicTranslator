name: Test

on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  lyrics-core:
    name: LyricsCore (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: swift-actions/setup-swift@v2
        if: runner.os == 'Linux'
        with:
          swift-version: "6.0"
      - name: Run Swift tests
        run: swift run LyricsCoreTestRunner

  cider-plugin:
    name: Cider plugin (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run plugin tests
        run: npm test --prefix cider-plugin
      - name: Bundle plugin
        run: npm run bundle --prefix cider-plugin
